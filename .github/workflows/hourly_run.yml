name: Hourly Telegram Scraper

on:
  schedule:
    # Executes once per hour between 06:00 and 18:00 UTC,
    # corresponding approximately to 09:30–21:30 Iran local time.
    - cron: '0 6-18 * * *'
  workflow_dispatch:

concurrency:
  group: telegram-scraper
  cancel-in-progress: true

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    # Terminates the job after 7 minutes to prevent unnecessary quota consumption
    # in the event of a hang, infinite loop, or external service delay.
    timeout-minutes: 7

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'  # Enables pip cache to reduce dependency installation time in subsequent runs.

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python main.py
