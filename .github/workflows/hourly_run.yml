# Workflow name
name: hourly_run

# Defines when the workflow runs
on:
  # Allows the workflow to be triggered manually or via the GitHub API
  workflow_dispatch:

# Defines concurrency rules to manage simultaneous workflow runs
concurrency:
  # Ensures that only one scraper run is active at a time
  group: telegram-scraper
  # Cancels any in-progress run if a new one is triggered
  cancel-in-progress: true

# Defines the jobs that will be executed
jobs:
  run-scraper:
    # Specifies the runner environment
    runs-on: ubuntu-latest
    # Prevents the job from running indefinitely
    timeout-minutes: 7
    
    # Allows the workflow to push changes back to the repository
    permissions:
      contents: write

    # Defines the sequence of execution steps
    steps:
      # Step 1: Check out repository contents
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up the required Python runtime
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Uses Python 3.11 for compatibility and stability
          python-version: '3.11'
          # Caches pip packages to improve workflow performance
          cache: 'pip'

      # Step 3: Install project dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run the main scraper script
      - name: Run scraper
        env:
          # Inject secrets securely into the runtime environment
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python main.py

      # Step 5: Commit and Push the market_log.txt file to the repository
      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # اگر فایل در پوشه فرعی نیست، همین خط کافی است. 
          # اگر فایل داخل پوشه دیگری ذخیره می‌شود، مسیر آن را جایگزین کنید (مثلا Scraper/market_log.txt)
          git add market_log.txt
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update market log [skip ci]" && git push)
